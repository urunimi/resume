[mcp_servers.linear]
env_vars = ["LINEAR_API_KEY_URUNIMI"]
command = "sh"
args = ["-c", ": \"${LINEAR_API_KEY_URUNIMI:?LINEAR_API_KEY_URUNIMI is required}\"; exec npx -y mcp-remote@0.14.3 https://mcp.linear.app/mcp --transport http-only --header \"Authorization:Bearer $LINEAR_API_KEY_URUNIMI\""]
required = true
startup_timeout_sec = 60
